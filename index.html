<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        0
        <div class="displayMode">F</div>
        <div class="partial-sum">X</div>
      </div>

      <div class="row">
        <button class="mode">DEG</button>
        <button class="mode mfe">F-E</button>
        <button class="history">History</button>
      </div>

      <div class="row">
        <button class="memory mc">MC</button>
        <button class="memory mr">MR</button>
        <button class="memory mp">M+</button>
        <button class="memory mm">M-</button>
        <button class="memory ms">MS</button>
      </div>

      <div class="row">
        <button class="trig sin">sin</button>
        <button class="trig cos">cos</button>
        <button class="trig tan">tan</button>
        <button class="trig cosec">cosec</button>
        <button class="trig sec">sec</button>
        <button class="trig cot">cot</button>
      </div>

      <div class="row">
        <button class="fn second">2<sup>nd</sup></button>
        <button class="fn pie">pie</button>
        <button class="back">C</button>
        <!-- <button class="fn abs">|x|</button> -->
      </div>

      <div class="row">
        <button class="fn rand">rand</button>
        <button class="fn dms">dms</button>
        <button class="fn deg">degree</button>
        <button class="fn floor">floor</button>
        <button class="fn ceil">ceil</button>
        <button class="fn clear">clear</button>
      </div>

      <div class="row">
        <button class="fn square">x²</button>
        <button class="fn reciprocal">1/x</button>
        <button class="fn abs">|x|</button>
        <button class="fn exp">exp</button>
        <button class="operator percent">%</button>
      </div>

      <div class="row">
        <button class="fn sqrt">²√x</button>
        <button class="bracket open">(</button>
        <button class="bracket close">)</button>
        <button class="fn factorial">n!</button>
        <button class="operator divide">/</button>
      </div>

      <div class="row">
        <button class="fn power">xʸ</button>
        <button class="num seven">7</button>
        <button class="num eight">8</button>
        <button class="num nine">9</button>
        <button class="operator multiply">*</button>
      </div>

      <div class="row">
        <button class="fn ten-power">10ˣ</button>
        <button class="num four">4</button>
        <button class="num five">5</button>
        <button class="num six">6</button>
        <button class="operator subtract">-</button>
      </div>

      <div class="row">
        <button class="fn log">log</button>
        <button class="num one">1</button>
        <button class="num two">2</button>
        <button class="num three">3</button>
        <button class="operator add">+</button>
      </div>

      <div class="row">
        <button class="fn ln">ln</button>
        <button class="fn comma">,</button>
        <button class="num zero">0</button>
        <button class="decimal">.</button>
        <button class="equals">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
